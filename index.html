<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>🎭 Mafia Bet</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080810; font-family: 'DM Sans', sans-serif; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  @keyframes fadeUp { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API_URL = "https://mafia-bet-backend.onrender.com";

async function api(path, options = {}) {
  const token = localStorage.getItem("mafbet_token");
  const res = await fetch(API_URL + path, {
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
      ...options.headers,
    },
    ...options,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || "HTTP " + res.status);
  }
  return res.json();
}

async function adminApi(path, options = {}) {
  const adminKey = localStorage.getItem("mafbet_admin_key") || "";
  const res = await fetch(API_URL + path, {
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Key": adminKey,
      ...options.headers,
    },
    ...options,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || "HTTP " + res.status);
  }
  return res.json();
}

function uid() { return "id" + Math.random().toString(36).slice(2, 9); }

// ─── Toast ────────────────────────────────────────────────────────────────────
function Toast({ msg, type }) {
  const colors = {
    success: { bg:"#0f2a1a", border:"#2d7a4f", text:"#5dbd88" },
    error:   { bg:"#2a0f0f", border:"#7a2d2d", text:"#bd5d5d" },
    info:    { bg:"#0f1e2a", border:"#2d5a7a", text:"#5d9ebd" },
  };
  const c = colors[type] || colors.info;
  return (
    <div style={{position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",
      background:c.bg,border:"1px solid " + c.border,borderRadius:14,
      padding:"11px 20px",fontSize:13,fontWeight:600,color:c.text,
      boxShadow:"0 8px 32px rgba(0,0,0,0.6)",whiteSpace:"nowrap",
      zIndex:3000,animation:"fadeUp .3s ease",maxWidth:"88vw",textAlign:"center"}}>
      {msg}
    </div>
  );
}

// ─── ModalWrap ────────────────────────────────────────────────────────────────
function ModalWrap({ title, onClose, children }) {
  return (
    <div style={{position:"fixed",inset:0,zIndex:2000,background:"rgba(0,0,0,0.85)",
      backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{width:"100%",background:"linear-gradient(180deg,#141420,#0c0c18)",
        borderTop:"1px solid rgba(255,107,107,0.2)",borderRadius:"22px 22px 0 0",
        padding:"22px 20px 36px",maxHeight:"90vh",overflowY:"auto",animation:"slideUp .28s ease"}}>
        <div style={{width:38,height:4,background:"rgba(255,255,255,0.12)",borderRadius:2,margin:"0 auto 18px"}}/>
        <div style={{fontFamily:"'Space Grotesk'",fontSize:18,fontWeight:800,color:"#fff",marginBottom:18}}>{title}</div>
        {children}
      </div>
    </div>
  );
}

function Btn({ children, onClick, variant="primary", disabled=false }) {
  const styles = {
    primary: {background:"linear-gradient(135deg,#e8c84a,#c8822a)",color:"#1a1000",border:"none"},
    danger:  {background:"rgba(220,50,50,0.12)",color:"#ff6b6b",border:"1px solid rgba(220,50,50,0.25)"},
    ghost:   {background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.5)",border:"1px solid rgba(255,255,255,0.08)"},
    success: {background:"rgba(139,195,74,0.12)",color:"#8bc34a",border:"1px solid rgba(139,195,74,0.25)"},
  };
  const s = styles[variant];
  return (
    <button onClick={onClick} disabled={disabled} style={{width:"100%",padding:"13px",borderRadius:12,
      cursor:disabled?"not-allowed":"pointer",fontSize:14,fontWeight:700,fontFamily:"'DM Sans'",
      marginBottom:8,opacity:disabled?0.4:1,...s}}>
      {children}
    </button>
  );
}

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function LoginScreen({ onLogin, loading, error }) {
  const [name, setName] = useState("");
  const [username, setUsername] = useState("");
  return (
    <div style={{minHeight:"100vh",background:"#080810",display:"flex",alignItems:"center",
      justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:360,textAlign:"center"}}>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:48,letterSpacing:5,color:"#e8c84a",marginBottom:4}}>МАФИЯ БЕТ</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.3)",marginBottom:40}}>Ставки на турниры по мафии</div>
        <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:20,padding:24}}>
          <div style={{fontSize:15,fontWeight:600,color:"#fff",marginBottom:20}}>👤 Войти в игру</div>
          {[
            {label:"Имя",val:name,set:setName,ph:"Иван Иванов"},
            {label:"Username",val:username,set:setUsername,ph:"@username"},
          ].map(({label,val,set,ph}) => (
            <div key={label} style={{marginBottom:14}}>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:6,textAlign:"left",textTransform:"uppercase",letterSpacing:"0.06em"}}>{label}</div>
              <input value={val} onChange={e=>set(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&name.trim()&&onLogin({name,username})}
                placeholder={ph}
                style={{width:"100%",padding:"12px 14px",borderRadius:12,border:"1px solid rgba(255,255,255,0.1)",
                  background:"rgba(255,255,255,0.05)",color:"#fff",fontSize:15,outline:"none",fontFamily:"'DM Sans'"}}/>
            </div>
          ))}
          {error && <div style={{fontSize:12,color:"#ff6b6b",marginBottom:12}}>❌ {error}</div>}
          <button onClick={()=>name.trim()&&onLogin({name,username})} disabled={!name.trim()||loading}
            style={{width:"100%",padding:"14px",borderRadius:14,border:"none",
              background:name.trim()?"linear-gradient(135deg,#e8c84a,#c8822a)":"rgba(255,255,255,0.06)",
              color:name.trim()?"#1a1000":"rgba(255,255,255,0.25)",
              fontSize:15,fontWeight:800,cursor:name.trim()?"pointer":"not-allowed",fontFamily:"'Space Grotesk'"}}>
            {loading?"⏳ Входим...":"🎭 Войти"}
          </button>
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.15)",marginTop:16}}>
          В Telegram Mini App вход будет автоматическим
        </div>
      </div>
    </div>
  );
}

// ─── PLAYER APP ───────────────────────────────────────────────────────────────
function PlayerApp({ currentUser, onSwitchAdmin, onLogout, showToast }) {
  const [tab, setTab] = useState("tournaments");
  const [tournaments, setTournaments] = useState([]);
  const [myBets, setMyBets] = useState([]);
  const [user, setUser] = useState(currentUser);
  const [betModal, setBetModal] = useState(null);
  const [topupModal, setTopupModal] = useState(false);
  const [loading, setLoading] = useState(true);

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    try {
      const [t, b, u] = await Promise.all([api("/tournaments"), api("/me/bets"), api("/me")]);
      setTournaments(t); setMyBets(b); setUser(u);
    } catch(e) { showToast("Ошибка: "+e.message, "error"); }
    setLoading(false);
  }

  async function handleConfirmBet(amount) {
    try {
      const res = await api("/bets", {method:"POST", body:JSON.stringify({
        tournament_id: betModal.tournament.id,
        participant_id: betModal.participant.id,
        amount,
      })});
      setUser(u=>({...u, coins:res.new_balance}));
      setBetModal(null);
      showToast("✅ Ставка принята! Выигрыш: 🪙" + res.bet.payout.toLocaleString());
      loadData();
    } catch(e) { showToast("❌ "+e.message, "error"); }
  }

  async function handleTopup(amount, comment) {
    try {
      await api("/topup/request", {method:"POST", body:JSON.stringify({amount, comment})});
      setTopupModal(false);
      showToast("✅ Запрос отправлен! Ожидайте подтверждения.");
    } catch(e) { showToast("❌ "+e.message, "error"); }
  }

  const wonBets = myBets.filter(b => b.tournament_status==="settled" && b.winner_id===b.participant_id);
  const totalWon = wonBets.reduce((s,b)=>s+b.payout, 0);

  return (
    <div style={{minHeight:"100vh",background:"#080810",color:"#fff",maxWidth:480,margin:"0 auto"}}>
      {/* Header */}
      <div style={{padding:"18px 18px 0",position:"sticky",top:0,zIndex:100,
        background:"linear-gradient(180deg,#080810 85%,transparent)",backdropFilter:"blur(8px)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div>
            <div style={{fontFamily:"'Bebas Neue'",fontSize:26,letterSpacing:3,color:"#e8c84a",lineHeight:1}}>МАФИЯ БЕТ</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginTop:2}}>Привет, {user.name} 👋</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>setTopupModal(true)} style={{background:"rgba(139,195,74,0.12)",
              border:"1px solid rgba(139,195,74,0.25)",borderRadius:10,padding:"7px 10px",
              color:"#8bc34a",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans'"}}>
              💰 Пополнить
            </button>
            <div style={{background:"rgba(232,200,74,0.12)",border:"1px solid rgba(232,200,74,0.3)",
              borderRadius:12,padding:"8px 14px",display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:16}}>🪙</span>
              <span style={{fontFamily:"'Space Grotesk'",fontSize:17,fontWeight:800,color:"#e8c84a"}}>
                {(user.coins||0).toLocaleString()}
              </span>
            </div>
            <button onClick={onSwitchAdmin} title="Админ панель"
              style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",
                borderRadius:10,padding:"8px 10px",color:"rgba(255,255,255,0.4)",fontSize:14,cursor:"pointer"}}>
              ⚙️
            </button>
          </div>
        </div>
        {/* Tabs */}
        <div style={{display:"flex",background:"rgba(255,255,255,0.05)",borderRadius:12,padding:3,gap:2,marginBottom:4}}>
          {[["tournaments","🎭","Турниры"],["mybets","🎯","Ставки"],["profile","👤","Профиль"]].map(([id,ic,lb])=>(
            <button key={id} onClick={()=>{setTab(id);if(id!=="tournaments")loadData();}}
              style={{flex:1,padding:"8px 4px",borderRadius:9,border:"none",cursor:"pointer",
                background:tab===id?"linear-gradient(135deg,#e8c84a,#c8822a)":"transparent",
                color:tab===id?"#1a1000":"rgba(255,255,255,0.4)",
                fontSize:12,fontWeight:700,fontFamily:"'DM Sans'",transition:"all .2s"}}>
              {ic} {lb}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{padding:"12px 16px 100px"}}>
        {loading ? (
          <div style={{textAlign:"center",padding:"80px 0",color:"rgba(255,255,255,0.3)"}}>
            <div style={{fontSize:40,marginBottom:12,display:"inline-block",animation:"spin 1s linear infinite"}}>🎭</div>
            <div style={{fontSize:14}}>Загрузка...</div>
          </div>
        ) : tab==="tournaments" ? (
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {tournaments.length===0 ? (
              <div style={{textAlign:"center",padding:"80px 0",color:"rgba(255,255,255,0.25)"}}>
                <div style={{fontSize:48,marginBottom:12}}>🎭</div>
                <div style={{fontSize:16,fontWeight:600,marginBottom:6}}>Турниров пока нет</div>
                <div style={{fontSize:13}}>Администратор скоро создаст первый турнир</div>
              </div>
            ) : tournaments.map(t=>(
              <TournamentCard key={t.id} tournament={t} myBets={myBets}
                onBet={(t,p)=>setBetModal({tournament:t,participant:p})}/>
            ))}
          </div>
        ) : tab==="mybets" ? (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {myBets.length===0 ? (
              <div style={{textAlign:"center",padding:"80px 0",color:"rgba(255,255,255,0.25)"}}>
                <div style={{fontSize:48,marginBottom:12}}>🎯</div>
                <div style={{fontSize:16,fontWeight:600}}>Ставок пока нет</div>
              </div>
            ) : myBets.map(b=><BetRow key={b.id} bet={b}/>)}
          </div>
        ) : (
          <PlayerProfile user={user} myBets={myBets} wonBets={wonBets} totalWon={totalWon} onLogout={onLogout}/>
        )}
      </div>

      {betModal && <BetModal tournament={betModal.tournament} participant={betModal.participant}
        balance={user.coins} onClose={()=>setBetModal(null)} onConfirm={handleConfirmBet}/>}
      {topupModal && <TopupModal onClose={()=>setTopupModal(false)} onConfirm={handleTopup}/>}
    </div>
  );
}

function TournamentCard({ tournament, myBets, onBet }) {
  const isSettled = tournament.status==="settled";
  const myBet = myBets.find(b=>b.tournament_id===tournament.id);
  const parts = typeof tournament.participants==="string" ? JSON.parse(tournament.participants) : (tournament.participants||[]);
  return (
    <div style={{background:"linear-gradient(145deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02))",
      border:"1px solid rgba(255,255,255,0.08)",borderRadius:20,overflow:"hidden"}}>
      <div style={{padding:"16px 18px 12px",borderBottom:"1px solid rgba(255,255,255,0.06)",
        background:isSettled?"rgba(139,195,74,0.03)":"rgba(232,200,74,0.02)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1,marginRight:10}}>
            <div style={{fontFamily:"'Space Grotesk'",fontSize:17,fontWeight:800,color:"#fff",lineHeight:1.2}}>{tournament.name}</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginTop:4}}>{tournament.description}</div>
          </div>
          <span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,flexShrink:0,
            background:isSettled?"rgba(139,195,74,0.15)":"rgba(232,200,74,0.15)",
            color:isSettled?"#8bc34a":"#e8c84a",
            border:isSettled?"1px solid rgba(139,195,74,0.3)":"1px solid rgba(232,200,74,0.3)"}}>
            {isSettled?"✅ Завершён":"🔥 Идёт"}
          </span>
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.25)",marginTop:8,display:"flex",gap:12}}>
          <span>📅 {tournament.ends_at}</span>
          {myBet && <span style={{color:"#e8c84a"}}>✓ Ставка сделана</span>}
        </div>
      </div>
      <div style={{padding:"12px 14px",display:"flex",flexDirection:"column",gap:8}}>
        {parts.map(p=>{
          const isWinner = tournament.winner_id===p.id;
          const isMine = myBet?.participant_id===p.id;
          return (
            <div key={p.id} onClick={()=>!isSettled&&onBet(tournament,p)}
              style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                padding:"10px 12px",borderRadius:12,
                cursor:isSettled?"default":"pointer",
                background:isWinner?"rgba(139,195,74,0.12)":isMine?"rgba(232,200,74,0.08)":"rgba(255,255,255,0.03)",
                border:isWinner?"1px solid rgba(139,195,74,0.3)":isMine?"1px solid rgba(232,200,74,0.2)":"1px solid rgba(255,255,255,0.05)",
                transition:"all .15s"}}
              onMouseEnter={e=>{if(!isSettled)e.currentTarget.style.background="rgba(232,200,74,0.1)";}}
              onMouseLeave={e=>{e.currentTarget.style.background=isWinner?"rgba(139,195,74,0.12)":isMine?"rgba(232,200,74,0.08)":"rgba(255,255,255,0.03)";}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:36,height:36,borderRadius:"50%",flexShrink:0,
                  background:"linear-gradient(135deg,#e8c84a,#c8822a)",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:11,fontWeight:800,color:"#1a1000",fontFamily:"'Space Grotesk'"}}>
                  {p.avatar||p.name?.slice(0,2).toUpperCase()}
                </div>
                <div>
                  <div style={{fontSize:14,fontWeight:600,color:"#fff"}}>{p.name}</div>
                  <div style={{fontSize:11,color:"rgba(255,255,255,0.35)"}}>{p.role}</div>
                  {isWinner&&<div style={{fontSize:11,color:"#8bc34a",fontWeight:700}}>🏆 Победитель</div>}
                  {isMine&&!isSettled&&<div style={{fontSize:11,color:"#e8c84a"}}>🎯 Ваша ставка</div>}
                </div>
              </div>
              <div style={{padding:"5px 12px",borderRadius:8,fontFamily:"'Space Grotesk'",fontSize:15,fontWeight:800,
                background:isSettled?"rgba(255,255,255,0.04)":"rgba(232,200,74,0.15)",
                border:isSettled?"1px solid rgba(255,255,255,0.06)":"1px solid rgba(232,200,74,0.25)",
                color:isSettled?"rgba(255,255,255,0.3)":"#e8c84a"}}>
                ×{parseFloat(p.odds).toFixed(1)}
              </div>
            </div>
          );
        })}
      </div>
      {!isSettled&&<div style={{textAlign:"center",padding:"0 0 14px",fontSize:11,color:"rgba(255,255,255,0.2)",fontStyle:"italic"}}>
        Нажми на участника, чтобы поставить
      </div>}
    </div>
  );
}

function BetRow({ bet }) {
  const won = bet.tournament_status==="settled" && bet.winner_id===bet.participant_id;
  const lost = bet.tournament_status==="settled" && bet.winner_id!==bet.participant_id;
  const sc = won?"#8bc34a":lost?"#e05555":"#e8c84a";
  return (
    <div style={{background:sc+"0d",border:"1px solid "+sc+"30",borderRadius:14,padding:"13px 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginBottom:3}}>{bet.tournament_name}</div>
          <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>{bet.participant_id}</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginTop:2}}>
            Ставка: <span style={{color:"#e8c84a"}}>🪙{bet.amount?.toLocaleString()}</span>
          </div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:11,fontWeight:700,color:sc,background:sc+"18",
            border:"1px solid "+sc+"40",borderRadius:20,padding:"3px 10px",marginBottom:6}}>
            {won?"✅ Выигрыш":lost?"❌ Проигрыш":"⏳ В игре"}
          </div>
          {won&&<div style={{fontSize:15,fontWeight:800,color:"#8bc34a"}}>+🪙{bet.payout?.toLocaleString()}</div>}
        </div>
      </div>
    </div>
  );
}

function PlayerProfile({ user, myBets, wonBets, totalWon, onLogout }) {
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:"linear-gradient(145deg,rgba(232,200,74,0.1),rgba(200,130,42,0.05))",
        border:"1px solid rgba(232,200,74,0.15)",borderRadius:20,padding:"24px 20px",textAlign:"center"}}>
        <div style={{width:64,height:64,borderRadius:"50%",margin:"0 auto 12px",
          background:"linear-gradient(135deg,#e8c84a,#c8822a)",
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>🎭</div>
        <div style={{fontFamily:"'Space Grotesk'",fontSize:20,fontWeight:800,color:"#fff"}}>{user.name}</div>
        <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginTop:4}}>{user.username}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {[
          {label:"Монет",val:(user.coins||0).toLocaleString(),icon:"🪙",c:"#e8c84a"},
          {label:"Ставок",val:myBets.length,icon:"🎯",c:"#64b5f6"},
          {label:"Побед",val:wonBets.length,icon:"🏆",c:"#8bc34a"},
          {label:"Выиграно",val:"🪙"+totalWon.toLocaleString(),icon:"💎",c:"#ce93d8"},
        ].map(s=>(
          <div key={s.label} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"14px",textAlign:"center"}}>
            <div style={{fontSize:22,marginBottom:6}}>{s.icon}</div>
            <div style={{fontFamily:"'Space Grotesk'",fontSize:20,fontWeight:800,color:s.c}}>{s.val}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",marginTop:2}}>{s.label}</div>
          </div>
        ))}
      </div>

// ─── ADMIN APP ────────────────────────────────────────────────────────────────
function AdminApp({ onExit, showToast }) {
  const [tab, setTab] = useState("tournaments");
  const [tournaments, setTournaments] = useState([]);
  const [users, setUsers] = useState([]);
  const [topupRequests, setTopupRequests] = useState([]);
  const [modal, setModal] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(()=>{loadAll();},[]);

  async function loadAll() {
    setLoading(true);
    try {
      const [t,u,r] = await Promise.all([
        api("/tournaments"),
        adminApi("/admin/users"),
        adminApi("/admin/topup/requests"),
      ]);
      setTournaments(Array.isArray(t)?t:[]);
      setUsers(Array.isArray(u)?u:[]);
      setTopupRequests(Array.isArray(r)?r:[]);
    } catch(e) { showToast("❌ "+e.message,"error"); }
    setLoading(false);
  }

  async function handleApprove(id) {
    try { await adminApi("/admin/topup/" + id + "/approve",{method:"POST"}); showToast("✅ Пополнение одобрено!"); loadAll(); }
    catch(e) { showToast("❌ "+e.message,"error"); }
  }
  async function handleReject(id) {
    try { await adminApi("/admin/topup/" + id + "/reject",{method:"POST",body:JSON.stringify({reason:"Отклонено"})}); showToast("Запрос отклонён","info"); loadAll(); }
    catch(e) { showToast("❌ "+e.message,"error"); }
  }

  const pending = topupRequests.filter(r=>r.status==="pending");

  return (
    <div style={{minHeight:"100vh",background:"#0a0a0a",color:"#fff",maxWidth:480,margin:"0 auto"}}>
      {/* Header */}
      <div style={{padding:"16px 18px 0",position:"sticky",top:0,zIndex:100,
        background:"linear-gradient(180deg,#0a0a0a 85%,transparent)",backdropFilter:"blur(8px)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{fontFamily:"'Bebas Neue'",fontSize:24,letterSpacing:3,color:"#ff6b6b"}}>ADMIN</div>
              <div style={{background:"rgba(255,107,107,0.15)",border:"1px solid rgba(255,107,107,0.3)",
                borderRadius:6,padding:"2px 8px",fontSize:10,fontWeight:700,color:"#ff6b6b"}}>PANEL</div>
            </div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>Mafia Bet Backend</div>
          </div>
          <button onClick={onExit} style={{background:"rgba(255,255,255,0.06)",
            border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"7px 12px",
            color:"rgba(255,255,255,0.5)",fontSize:12,cursor:"pointer",fontFamily:"'DM Sans'"}}>← Выйти</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
          {[
            {label:"Турниров",val:tournaments.length,c:"#e8c84a"},
            {label:"Игроков",val:users.length,c:"#64b5f6"},
            {label:"Запросов",val:pending.length,c:pending.length>0?"#ff6b6b":"#8bc34a"},
          ].map(s=>(
            <div key={s.label} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:10,padding:"8px",textAlign:"center"}}>
              <div style={{fontFamily:"'Space Grotesk'",fontSize:18,fontWeight:800,color:s.c}}>{s.val}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>{s.label}</div>
            </div>
          ))}
        </div>
        <div style={{display:"flex",background:"rgba(255,255,255,0.04)",borderRadius:11,padding:3,gap:2,marginBottom:4}}>
          {[["tournaments","🎭","Турниры"],["users","👥","Игроки"],["topup","💰","Запросы"]].map(([id,ic,lb])=>(
            <button key={id} onClick={()=>setTab(id)}
              style={{flex:1,padding:"8px 4px",borderRadius:8,border:"none",cursor:"pointer",position:"relative",
                background:tab===id?"linear-gradient(135deg,#ff6b6b,#cc3333)":"transparent",
                color:tab===id?"#fff":"rgba(255,255,255,0.4)",
                fontSize:12,fontWeight:700,fontFamily:"'DM Sans'",transition:"all .2s"}}>
              {ic} {lb}
              {id==="topup"&&pending.length>0&&(
                <span style={{position:"absolute",top:2,right:4,background:"#ff6b6b",borderRadius:"50%",
                  width:14,height:14,fontSize:9,fontWeight:800,display:"flex",alignItems:"center",
                  justifyContent:"center",color:"#fff"}}>{pending.length}</span>
              )}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"12px 16px 100px"}}>
        {loading ? (
          <div style={{textAlign:"center",padding:"80px 0",color:"rgba(255,255,255,0.3)"}}>
            <div style={{fontSize:40,marginBottom:12,display:"inline-block",animation:"spin 1s linear infinite"}}>⚙️</div>
            <div>Загрузка...</div>
          </div>
        ) : tab==="tournaments" ? (
          <AdminTournaments tournaments={tournaments} setModal={setModal} onReload={loadAll} showToast={showToast}/>
        ) : tab==="users" ? (
          <AdminUsers users={users} setModal={setModal}/>
        ) : (
          <AdminTopup requests={topupRequests} onApprove={handleApprove} onReject={handleReject}/>
        )}
      </div>

      {modal?.type==="create_tournament"&&(
        <CreateTournamentModal onClose={()=>setModal(null)} onCreate={async t=>{
          try{await adminApi("/admin/tournaments",{method:"POST",body:JSON.stringify(t)});showToast("🎭 Турнир создан!");setModal(null);loadAll();}
          catch(e){showToast("❌ "+e.message,"error");}
        }}/>
      )}
      {modal?.type==="edit_tournament"&&(
        <EditTournamentModal tournament={modal.data} onClose={()=>setModal(null)}
          onSave={async t=>{try{await adminApi("/admin/tournaments/" + t.id,{method:"PATCH",body:JSON.stringify(t)});showToast("💾 Сохранено");setModal(null);loadAll();}catch(e){showToast("❌ "+e.message,"error");}}}
          onSettle={async(tid,pid)=>{try{await adminApi("/admin/tournaments/" + tid + "/settle",{method:"POST",body:JSON.stringify({winner_participant_id:pid})});showToast("🏆 Турнир завершён!");setModal(null);loadAll();}catch(e){showToast("❌ "+e.message,"error");}}}
          onDelete={async tid=>{try{await adminApi("/admin/tournaments/" + tid,{method:"DELETE"});showToast("🗑️ Удалён","info");setModal(null);loadAll();}catch(e){showToast("❌ "+e.message,"error");}}}
        />
      )}
      {modal?.type==="edit_user"&&(
        <EditUserModal user={modal.data} onClose={()=>setModal(null)}
          onSave={async(uid,op,amt)=>{try{await adminApi("/admin/users/" + uid + "/coins",{method:"PATCH",body:JSON.stringify({operation:op,amount:amt})});showToast("✅ Баланс обновлён");setModal(null);loadAll();}catch(e){showToast("❌ "+e.message,"error");}}}
        />
      )}
    </div>
  );
}

                  <div style={{fontSize:12,color:"rgba(255,255,255,0.3)"}}>🪙{r.amount?.toLocaleString()}</div>
                </div>
                <div style={{fontSize:12,fontWeight:700,color:r.status==="approved"?"#8bc34a":"#ff6b6b"}}>
                  {r.status==="approved"?"✅ Одобрен":"❌ Отклонён"}
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ─── Admin Tournament Modals ───────────────────────────────────────────────────
function CreateTournamentModal({ onClose, onCreate }) {
  const [name,setName]=useState(""); const [desc,setDesc]=useState(""); const [endsAt,setEndsAt]=useState("");
  const [parts,setParts]=useState([{id:uid(),name:"",role:"",odds:"2.0",avatar:""},{id:uid(),name:"",role:"",odds:"3.0",avatar:""}]);
  function upP(id,f,v){setParts(p=>p.map(x=>x.id===id?{...x,[f]:v}:x));}
  function handleCreate(){
    const filled=parts.filter(p=>p.name.trim());
    if(!name.trim()||filled.length<2)return;
    onCreate({name:name.trim(),description:desc.trim(),ends_at:endsAt||"—",
      participants:filled.map(p=>({...p,avatar:p.avatar||p.name.slice(0,2).toUpperCase(),odds:parseFloat(p.odds)||2}))});
  }
  const InField = ({label,value,onChange,placeholder,type="text",style={}}) => (
    <div>
      <div style={{fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:4,textTransform:"uppercase"}}>{label}</div>
      <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
        style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",
          background:"rgba(255,255,255,0.04)",color:"#fff",fontSize:13,outline:"none",fontFamily:"'DM Sans'",...style}}/>
    </div>
  );
  return (
    <ModalWrap title="🎭 Новый турнир" onClose={onClose}>
      {[["Название",name,setName,"Весенний кубок"],["Описание",desc,setDesc,"Открытый чемпионат"],["Дата",endsAt,setEndsAt,"2026-06-30"]].map(([lb,v,s,ph])=>(
        <div key={lb} style={{marginBottom:12}}>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.06em"}}>{lb}</div>
          <input value={v} onChange={e=>s(e.target.value)} placeholder={ph}
            style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,0.1)",
              background:"rgba(255,255,255,0.05)",color:"#fff",fontSize:14,outline:"none",fontFamily:"'DM Sans'"}}/>
        </div>
      ))}
      <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.06em"}}>Участники</div>
      {parts.map((p,i)=>(
        <div key={p.id} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:12,padding:"12px",marginBottom:8,position:"relative"}}>
          <div style={{fontSize:12,fontWeight:700,color:"rgba(255,255,255,0.3)",marginBottom:8}}>Игрок {i+1}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <InField label="Имя" value={p.name} onChange={v=>upP(p.id,"name",v)} placeholder="Иван Иванов"/>
            <InField label="Роль" value={p.role} onChange={v=>upP(p.id,"role",v)} placeholder="Годфазер"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <InField label="Коэффициент" value={p.odds} onChange={v=>upP(p.id,"odds",v)} placeholder="2.0" type="number"
              style={{border:"1px solid rgba(232,200,74,0.2)",background:"rgba(232,200,74,0.06)",color:"#e8c84a",fontFamily:"'Space Grotesk'",fontWeight:700}}/>
            <InField label="Аватар (2 букв)" value={p.avatar} onChange={v=>upP(p.id,"avatar",v.slice(0,2).toUpperCase())} placeholder="ИИ"/>
          </div>
          {parts.length>2&&<button onClick={()=>setParts(p=>p.filter(x=>x.id!==p.id))}
            style={{position:"absolute",top:10,right:10,background:"rgba(220,50,50,0.1)",border:"1px solid rgba(220,50,50,0.2)",borderRadius:6,color:"#ff6b6b",fontSize:11,padding:"2px 8px",cursor:"pointer"}}>✕</button>}
        </div>
      ))}
      <button onClick={()=>setParts(p=>[...p,{id:uid(),name:"",role:"",odds:"2.0",avatar:""}])}
        style={{width:"100%",padding:"10px",borderRadius:10,border:"1px dashed rgba(255,255,255,0.15)",background:"transparent",color:"rgba(255,255,255,0.35)",fontSize:13,cursor:"pointer",marginBottom:16,fontFamily:"'DM Sans'"}}>
        ＋ Участник
      </button>
      <Btn onClick={handleCreate} disabled={!name.trim()||parts.filter(p=>p.name.trim()).length<2}>🎭 Создать турнир</Btn>
      <Btn onClick={onClose} variant="ghost">Отмена</Btn>
    </ModalWrap>
  );
}

    </ModalWrap>

// ─── ADMIN KEY SCREEN ─────────────────────────────────────────────────────────
function AdminKeyScreen({ onSuccess, onCancel }) {
  const [key,setKey]=useState(""); const [err,setErr]=useState(false); const [loading,setLoading]=useState(false);
  async function tryKey(){
    if(!key)return; setLoading(true); setErr(false);
    try {
      const res = await fetch(API_URL+"/admin/users",{headers:{"X-Admin-Key":key,"Content-Type":"application/json"}});
      if(res.ok){ localStorage.setItem("mafbet_admin_key",key); onSuccess(); }
      else { setErr(true); }
    } catch { setErr(true); }
    setLoading(false);
  }
  return (
    <div style={{minHeight:"100vh",background:"#080810",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:340,textAlign:"center"}}>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:32,letterSpacing:4,color:"#ff6b6b",marginBottom:6}}>ADMIN</div>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.35)",marginBottom:32}}>Введите Admin Key из настроек Render</div>
        <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:20,padding:24}}>
          <input value={key} onChange={e=>setKey(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryKey()}
            type="password" placeholder="Admin Key..."
            style={{width:"100%",padding:"13px 16px",borderRadius:12,
              border:err?"1px solid rgba(220,80,80,0.5)":"1px solid rgba(255,255,255,0.1)",
              background:"rgba(255,255,255,0.05)",color:"#fff",fontSize:15,outline:"none",
              fontFamily:"'DM Sans'",marginBottom:12}}/>
          {err&&<div style={{color:"#ff6b6b",fontSize:12,marginBottom:12}}>❌ Неверный ключ</div>}
          <button onClick={tryKey} disabled={!key||loading}
            style={{width:"100%",padding:"13px",borderRadius:12,border:"none",
              background:key?"linear-gradient(135deg,#ff6b6b,#cc3333)":"rgba(255,255,255,0.06)",
              color:key?"#fff":"rgba(255,255,255,0.25)",
              fontSize:15,fontWeight:800,cursor:key?"pointer":"not-allowed",
              fontFamily:"'Space Grotesk'",marginBottom:10}}>
            {loading?"⏳ Проверяем...":"Войти в админку"}
          </button>
          <button onClick={onCancel}
            style={{width:"100%",padding:"11px",borderRadius:12,border:"1px solid rgba(255,255,255,0.08)",
              background:"transparent",color:"rgba(255,255,255,0.35)",fontSize:13,cursor:"pointer",fontFamily:"'DM Sans'"}}>
            ← Назад
          </button>
        </div>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.15)",marginTop:16}}>
          Admin Key задаётся в переменной ADMIN_KEY на Render
        </div>
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [mode, setMode] = useState("loading");
  const [currentUser, setCurrentUser] = useState(null);
  const [loginLoading, setLoginLoading] = useState(false);
  const [loginError, setLoginError] = useState("");
  const [toast, setToast] = useState(null);

  useEffect(()=>{
    const token = localStorage.getItem("mafbet_token");
    if(token){
      api("/me").then(u=>{setCurrentUser(u);setMode("player");})
               .catch(()=>{localStorage.removeItem("mafbet_token");setMode("login");});
    } else { setMode("login"); }
  },[]);

  const showToast = useCallback((msg,type="success")=>{
    setToast({msg,type}); setTimeout(()=>setToast(null),3000);
  },[]);

  async function handleLogin(data) {
    setLoginLoading(true); setLoginError("");
    try {
      const tgUser = {id:Math.floor(Math.random()*999999)+1000, first_name:data.name, username:data.username.replace("@","")};
      const initData = "user=" + encodeURIComponent(JSON.stringify(tgUser)) + "&auth_date=" + Math.floor(Date.now()/1000);
      const res = await api("/auth/telegram",{method:"POST",body:JSON.stringify({init_data:initData})});
      localStorage.setItem("mafbet_token",res.token);
      setCurrentUser(res.user); setMode("player");
    } catch(e){ setLoginError(e.message); }
    setLoginLoading(false);
  }

  if(mode==="loading") return (
    <div style={{minHeight:"100vh",background:"#080810",display:"flex",alignItems:"center",justifyContent:"center",color:"#e8c84a"}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12,display:"inline-block",animation:"spin 1.2s linear infinite"}}>🎭</div>
        <div style={{fontFamily:"'Bebas Neue'",fontSize:24,letterSpacing:3}}>ЗАГРУЗКА...</div>
      </div>
    </div>
  );

  return (
    <>
      {mode==="login"&&<LoginScreen onLogin={handleLogin} loading={loginLoading} error={loginError}/>}
      {mode==="player"&&currentUser&&<PlayerApp currentUser={currentUser} onSwitchAdmin={()=>setMode("adminKey")} onLogout={()=>{localStorage.removeItem("mafbet_token");setCurrentUser(null);setMode("login");}} showToast={showToast}/>}
      {mode==="adminKey"&&<AdminKeyScreen onSuccess={()=>setMode("admin")} onCancel={()=>setMode("player")}/>}
      {mode==="admin"&&<AdminApp onExit={()=>setMode("player")} showToast={showToast}/>}
      {toast&&<Toast msg={toast.msg} type={toast.type}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
